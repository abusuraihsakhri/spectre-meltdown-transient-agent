name: Test and security regression checks

on:
  push:
    branches: [master, main, audit-407-reliability-web-security]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package and optional API/test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web,dev]"

      - name: Verify package metadata and syntax
        run: |
          python -m pip check
          python -m compileall -q agents spectre_meltdown cli.py simulator.py enrichment.py
          python -m pip wheel --no-deps --wheel-dir /tmp/package-dist .

      - name: Python regression tests
        run: python -m pytest -q

      - name: Browser JavaScript syntax and rule tests
        run: |
          node --check web/app.js
          node --test tests/browser-smoke.cjs

      - name: Installed CLI smoke checks
        run: |
          spectre-meltdown-transient-agent audit --primary 10 --secondary 2 --status NOMINAL
          spectre-meltdown-frontier audit --primary 10 --secondary 2 --status NOMINAL
