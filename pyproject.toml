[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectre-meltdown-transient-engine"
version = "2.0.0"
description = "Spectre / Meltdown Speculative Execution Side-Channel Verifier"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
spectre-meltdown-transient-engine = "spectre_meltdown.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/spectre-meltdown-transient-engine"
Repository = "https://github.com/abusuraihsakhri/spectre-meltdown-transient-engine.git"
